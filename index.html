<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Study Plan 1</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a2540;--bg2:#0f2f52;--ink:#f4f8fc;--mute:#a9c3da;--sky:#8fd3ff;--pink:#ff5c8a;--line:#24507a;--paper:#f6f9fc;--pink2:#2a0612;--green:#3ddc97;--green2:#06281a;--red:#ff6b6b}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Hanken Grotesk",system-ui,sans-serif;overflow-x:clip}
.band{padding-block:clamp(24px,4vw,52px);padding-inline:max(5vw,16px)}
.wrap{max-width:1100px;margin:0 auto}
.crumb{color:var(--mute);font-size:14px;font-weight:600;margin-bottom:8px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{font-weight:300;font-size:clamp(32px,5vw,52px);line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-weight:600;font-size:clamp(22px,3vw,30px);line-height:1.1;margin:0 0 14px}
p{margin:0 0 12px;max-width:68ch}
.trophy{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;white-space:nowrap}
.meter{width:140px;height:10px;border-radius:99px;background:#123a63;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--pink);transition:width .4s}
.trophy.plat .meter i{background:linear-gradient(90deg,#e8eef5,#8fd3ff,#e8eef5)}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px}
.bar{background:#0c2a49;border:1px solid var(--line);border-top:4px solid var(--sky);border-radius:8px;padding:14px}
.bar:nth-child(4){border-top-color:var(--pink)}
.bar small{display:block;color:var(--mute);font-size:13px;font-weight:600;margin-bottom:4px}
.bar div{font-size:16px;font-weight:600;line-height:1.35}
.alt{background:var(--bg2)}
.hint{color:var(--mute);font-size:15px;margin-bottom:16px}
.locks{display:grid;gap:12px}
details{background:#0c2a49;border:1px solid var(--line);border-radius:8px}
details[open]{border-color:var(--sky)}
summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:56px;font-weight:600;font-size:17px}
summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.lk{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);color:var(--mute);font-size:14px}
details.got .lk{background:var(--pink);border-color:var(--pink);color:var(--pink2)}
.body{padding:0 16px 16px 60px}
.src{color:var(--mute);font-size:14px}
.copyhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:8px 0}
button{font:600 15px "Hanken Grotesk",sans-serif;min-height:44px;padding:0 18px;border-radius:6px;border:1px solid var(--sky);background:transparent;color:var(--sky);cursor:pointer}
button:hover{background:#123a63}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
pre{overflow-x:auto;background:#06192c;border:1px solid var(--line);border-radius:8px;padding:14px;margin:0;font:14px/1.6 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:14px}
td:first-child{font-weight:600}
.opts{display:grid;gap:10px}
.opt{border:1px solid var(--line);border-radius:6px;padding:12px}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:2px 8px;border-radius:99px;background:#123a63;color:var(--sky);margin-bottom:6px}
.tag.w{background:var(--pink);color:var(--pink2)}
.pass{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px;margin-top:10px}
.pass div{border-radius:6px;padding:12px;font-size:15px}
.pass .ok{border:1px solid var(--sky)}
.pass .no{border:1px solid var(--pink)}
ol{padding-left:1.2em;margin:6px 0}
li{margin-bottom:6px}
/* wrong (red) vs right (blue) */
.vs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px;margin:8px 0 4px}
.vs div{border-radius:6px;padding:10px 12px;font-size:15px}
.vs .bad{border:1px solid var(--red);background:#2a1622}
.vs .good{border:1px solid var(--sky);background:#0f3358}
.vs b{display:block;font-size:13px;margin-bottom:2px}
.vs .bad b{color:var(--red)}
.vs .good b{color:var(--sky)}
/* try it now */
.try{margin-top:14px;border:1px dashed var(--sky);border-radius:8px;padding:14px;background:#0a2240}
.try.done{border-style:solid;border-color:var(--green)}
.tryhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--sky);margin-bottom:6px}
.try.done .tryhead{color:var(--green)}
.tryhead .st{font-size:12px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--mute)}
.try.done .tryhead .st{color:var(--green)}
.q{font-weight:600;margin-bottom:10px}
.choices{display:grid;gap:8px}
.choice{text-align:left;width:100%;min-height:48px;padding:10px 14px;border-color:var(--line);color:var(--ink);font-weight:400;line-height:1.4}
.choice.wrong{border-color:var(--red);background:#2a1622;color:#ffd1d1}
.choice.right{border-color:var(--green);background:var(--green);color:var(--green2);font-weight:600}
.fb{margin:10px 0 0;font-size:15px;min-height:1px}
.fb.no{color:#ffb3b3}
.fb.yes{color:var(--green)}
.field{display:grid;gap:6px;margin-top:10px}
.field label{font-weight:600;font-size:15px}
.field label small{display:block;font-weight:400;color:var(--mute);font-size:14px}
textarea,input[type=text]{width:100%;font:16px/1.45 "Hanken Grotesk",sans-serif;color:var(--ink);background:#06192c;border:1px solid var(--line);border-radius:6px;padding:10px 12px}
textarea{min-height:76px;resize:vertical}
.field.ok textarea,.field.ok input{border-color:var(--green)}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.frow span{font-size:13px;color:var(--mute)}
.field.ok .frow span{color:var(--green)}
.frow button{min-height:40px;padding:0 14px;font-size:14px}
/* next button */
.next{margin-top:22px}
.nextbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:68px;border-radius:10px;font:800 clamp(18px,2.6vw,22px) "Hanken Grotesk",sans-serif;text-decoration:none;text-align:center;padding:12px 18px}
.nextbtn.locked{background:#123a63;color:var(--mute);border:2px dashed var(--line);pointer-events:none}
.nextbtn.open{background:var(--pink);color:var(--pink2);border:2px solid var(--pink)}
.nextnote{text-align:center;color:var(--mute);font-size:14px;margin-top:8px}
.plat{display:none;margin-top:18px;padding:16px;border-radius:8px;background:linear-gradient(90deg,#dfe7f0,#8fd3ff);color:#0a2540;font-weight:600}
.plat.on{display:block}
.saved{margin-top:22px}
.saved pre{max-height:360px;overflow:auto}
@media(max-width:760px){.bars{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.body{padding-left:16px}table{font-size:13px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-lesson="home" id="top">
<section class="band">
<div class="wrap" style="max-width:640px">
<div class="crumb">Silerio Solutions</div>
<h1>Study Plan 1</h1>
<p style="margin-top:14px">Two lessons. Pass each card's Try it now to unlock the next lesson. What you type is saved on this phone and can be copied at the end.</p>
<div style="margin-top:20px">
<a href="lesson1.html" style="display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:8px;background:#0c2a49;color:var(--ink);text-decoration:none;margin-bottom:10px">
<span style="font-weight:300;font-size:32px;color:var(--sky);line-height:1">1</span><span><b>Fast digestion</b><br><span class="src">Read your agents in under a minute</span></span><span class="src" data-passed="l1">Open</span></a>
<a href="lesson2.html" style="display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:16px;border:1px solid var(--line);border-radius:8px;background:#0c2a49;color:var(--ink);text-decoration:none;margin-bottom:10px">
<span style="font-weight:300;font-size:32px;color:var(--sky);line-height:1">2</span><span><b>The manager brief</b><br><span class="src">Job, why, guardrails, done</span></span><span class="src" data-passed="l2">Open</span></a>
</div>
<a class="nextbtn open" href="lesson1.html" style="margin-top:14px">Start Lesson 1 →</a>
</div>
</section>
<script>
(function(){
// Every typed answer in Study Plan 1, in the order they get assembled.
const FIELDS=[
 ['Lesson 1: Fast digestion',[
  ['l1_project','Project that gets the style block first'],
  ['l1_secs','Seconds to find what my last report needed from me (before)'],
  ['l1_need','1. Needs you'],
  ['l1_goal','2. Goal met?'],
  ['l1_path','3. Short path'],
  ['l1_err','4. Errors and why']]],
 ['Lesson 2: The manager brief',[
  ['l2_job','Full job'],
  ['l2_why','Why'],
  ['l2_guard','Guardrails'],
  ['l2_done','Done looks like'],
  ['l2_task','First real task this brief goes to']]]
];
const P='sp1:';
const S={get:k=>{try{return localStorage.getItem(P+k)}catch(e){return null}},
 set:(k,v)=>{try{localStorage.setItem(P+k,v)}catch(e){}},
 clear:()=>{try{Object.keys(localStorage).filter(k=>k.startsWith(P)).forEach(k=>localStorage.removeItem(k))}catch(e){}}};

async function copyText(text,btn){
 const label=btn.dataset.label||btn.textContent;btn.dataset.label=label;
 let ok=false;
 try{await navigator.clipboard.writeText(text);ok=true}catch(e){
  const t=document.createElement('textarea');t.value=text;t.setAttribute('readonly','');t.style.position='fixed';t.style.opacity='0';
  document.body.appendChild(t);t.select();t.setSelectionRange(0,text.length);
  try{ok=document.execCommand('copy')}catch(e2){}
  t.remove();
 }
 btn.textContent=ok?'Copied':'Copy failed, select and copy by hand';
 setTimeout(()=>{btn.textContent=label},2000);
}

function assemble(){
 const out=['Study Plan 1: my answers',''];
 FIELDS.forEach(([lesson,fs])=>{
  out.push(lesson);
  fs.forEach(([id,label])=>{const v=(S.get('f:'+id)||'').trim();out.push(label+': '+(v||'(not answered yet)'))});
  out.push('');
 });
 return out.join('\n').trim();
}

document.addEventListener('DOMContentLoaded',()=>{
 if('scrollRestoration' in history)history.scrollRestoration='manual';
 window.scrollTo(0,0);

 // copy buttons for templates
 document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>{
  copyText(document.getElementById(b.dataset.copy).textContent,b)}));

 // quizzes
 document.querySelectorAll('.quiz').forEach(qz=>{
  const id=qz.dataset.quiz,ans=qz.dataset.answer,fb=qz.querySelector('.fb'),st=qz.querySelector('.st');
  const bs=[...qz.querySelectorAll('.choice')];
  const win=(b,silent)=>{
   qz.dataset.ok='1';qz.classList.add('done');b.classList.add('right');
   bs.forEach(x=>x.setAttribute('aria-disabled','true'));
   fb.className='fb yes';fb.textContent='Right. '+b.dataset.why;st.textContent='Passed';
   if(!silent){S.set('q:'+id,'ok');update()}
  };
  bs.forEach(b=>b.addEventListener('click',()=>{
   if(qz.dataset.ok)return;
   if(b.dataset.k===ans){win(b)}
   else{b.classList.add('wrong');fb.className='fb no';fb.textContent='Not this one. '+b.dataset.why+' Try again.'}
  }));
  if(S.get('q:'+id)==='ok'){const b=bs.find(x=>x.dataset.k===ans);if(b)win(b,true)}
 });

 // typed answers
 document.querySelectorAll('[data-save]').forEach(el=>{
  const id=el.dataset.save,min=+(el.dataset.min||1),wrap=el.closest('.field'),st=wrap.querySelector('.frow span');
  const v=S.get('f:'+id);if(v!==null)el.value=v;
  const check=()=>{const ok=el.value.trim().length>=min;wrap.classList.toggle('ok',ok);el.dataset.ok=ok?'1':'';
   st.textContent=ok?'Saved on this phone':(el.value.trim()?'Saved, keep going':'Not answered yet');return ok};
  el.addEventListener('input',()=>{S.set('f:'+id,el.value);check();update()});
  wrap.querySelector('button').addEventListener('click',e=>copyText(el.value.trim()?el.value:'(empty)',e.currentTarget));
  check();
 });

 // cards, meter, unlock
 const ds=[...document.querySelectorAll('#locks details')];
 const done=c=>{const qs=[...c.querySelectorAll('.quiz')],fs=[...c.querySelectorAll('[data-save][data-min]')];
  return qs.every(q=>q.dataset.ok)&&fs.every(f=>f.dataset.ok)};
 function update(){
  if(!ds.length)return;
  let n=0;
  ds.forEach(d=>{
   const ok=done(d);d.classList.toggle('got',ok);if(ok)n++;
   d.querySelectorAll('.try.typed').forEach(t=>t.classList.toggle('done',[...t.querySelectorAll('[data-save][data-min]')].every(f=>f.dataset.ok)));
  });
  const t=ds.length,all=n===t;
  document.getElementById('tcount').textContent=n+' / '+t;
  document.getElementById('tbar').style.width=(n/t*100)+'%';
  document.getElementById('trophy').classList.toggle('plat',all);
  document.getElementById('plat').classList.toggle('on',all);
  const nb=document.getElementById('nextbtn'),nn=document.getElementById('nextnote');
  if(nb){nb.classList.toggle('locked',!all);nb.classList.toggle('open',all);nb.setAttribute('aria-disabled',all?'false':'true');
   nb.tabIndex=all?0:-1;nb.querySelector('.ico').textContent=all?'→':'🔒';
   nn.textContent=all?'Passed. Tap to go on.':'Pass '+(t-n)+' more card'+(t-n===1?'':'s')+' to unlock.'}
  if(all)S.set('pass:'+document.body.dataset.lesson,'1');
  const sv=document.getElementById('allanswers');if(sv)sv.textContent=assemble();
 }
 window.SP1update=update;

 // assembled answers (any page that shows them)
 const sv=document.getElementById('allanswers');
 if(sv){sv.textContent=assemble();document.getElementById('copyall').addEventListener('click',e=>copyText(assemble(),e.currentTarget))}

 // progress on the start page
 document.querySelectorAll('[data-passed]').forEach(el=>{if(S.get('pass:'+el.dataset.passed))el.textContent='Passed'});

 // two-tap reset
 const rs=document.getElementById('reset');
 if(rs)rs.addEventListener('click',()=>{
  if(rs.dataset.armed){S.clear();location.href='index.html'}
  else{rs.dataset.armed='1';rs.textContent='Tap again to erase every answer';setTimeout(()=>{delete rs.dataset.armed;rs.textContent='Start over'},4000)}
 });

 update();
});
})();
</script>
</body>
</html>
